name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test nicoption_dashboard
      - run: python -m unittest discover -s tests
      - run: node --check bambo_bot/web_static/financial-csv.js
      - run: node --check bambo_bot/web_static/app.js
      - run: node tests/test_financial_csv.js
      - name: Check production settings
        env:
          DJANGO_DEBUG: "false"
          NICOPTION_SINGLE_USER_MODE: "true"
          DJANGO_SECRET_KEY: ci-only-A7!deployment-B9@check-C4#secret-D2$not-E8%production
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://example.com
          DJANGO_SECURE_COOKIES: "true"
          DJANGO_SSL_REDIRECT: "true"
          DJANGO_HSTS_SECONDS: "3600"
          DJANGO_HSTS_INCLUDE_SUBDOMAINS: "true"
          DJANGO_HSTS_PRELOAD: "true"
          DATABASE_URL: sqlite:////tmp/nicoption-ci.sqlite3
        run: python manage.py check --deploy
